# Nginx Configuration for HelpDesk Application
# Reverse proxy with load balancing and WebSocket support
#
# Features:
# - HTTPS/SSL with automatic HTTP → HTTPS redirect
# - API reverse proxy routing
# - WebSocket upgrade handling with proper timeouts
# - Gzip compression
# - Security headers
# - Long-polling and real-time support
#
# Certificate locations:
#   SSL Certificate: ${NGINX_CERT_PATH:-/etc/nginx/certs/fullchain.pem}
#   SSL Key: ${NGINX_KEY_PATH:-/etc/nginx/certs/privkey.pem}

# Run nginx as unprivileged user (created during Docker build)
user nginx;

# Auto-detect number of CPU cores for worker processes
# Can be overridden with: worker_processes N;
worker_processes auto;

# Maximum number of open file descriptors per worker process
worker_rlimit_nofile 65535;

# Error log configuration
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Events configuration
events {
    # Maximum number of simultaneous connections per worker
    worker_connections 2048;

    # Optimized connection processing
    use epoll;
    multi_accept on;
}

http {
    # ============================================
    # Basic Settings
    # ============================================

    # MIME types mapping
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format (combined format with response time)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile off;                   # Disabled for proxied content - use off for dynamic responses from backend
    tcp_nopush on;                  # Buffer output to fit in one TCP packet
    tcp_nodelay on;                 # Disable Nagle's algorithm (important for real-time)
    keepalive_timeout 65s;          # Keep-alive timeout
    types_hash_max_size 2048;
    client_max_body_size 100M;      # Max upload size

    # Hide nginx version
    server_tokens off;

    # ============================================
    # Compression (Gzip)
    # ============================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;              # Compression level (1-9, higher = more CPU)
    gzip_types text/plain
              text/css
              text/xml
              text/javascript
              application/json
              application/javascript
              application/xml+rss
              application/atom+xml
              image/svg+xml
              application/x-font-ttf;
    gzip_min_length 1000;           # Only compress responses larger than 1KB
    gzip_disable "msie6";           # Disable for IE6

    # ============================================
    # Upstream Backend Definition
    # ============================================

    # Backend server pool
    # In Docker: service name 'backend' resolves to container IP
    # Local dev: localhost:8000
    upstream backend {
        # Use least connections load balancing
        least_conn;

        server backend:8000 max_fails=3 fail_timeout=30s;
        # Uncomment below for multiple backend instances (load balancing)
        # server backend:8000 weight=1;
        # server backend:8001 weight=1;
        # server backend:8002 weight=1;

        # Keep idle connections alive to backend
        keepalive 32;
    }

    # ============================================
    # HTTP Server Block (Redirect to HTTPS)
    # ============================================

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;

        # Allow Let's Encrypt ACME challenge (/.well-known/acme-challenge/)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check endpoint (responds before SSL redirect)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect all HTTP traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ============================================
    # HTTPS Server Block (Main Application)
    # ============================================

    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;

        server_name _;

        # ============================================
        # SSL/TLS Configuration
        # ============================================

        # Certificate paths (mounted from docker volumes)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # SSL/TLS protocol versions (modern configuration)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # HSTS (Strict-Transport-Security) - browser must use HTTPS
        # ⚠️ WARNING: Set only after confirming HTTPS works perfectly
        # Uncomment for production:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ============================================
        # Security Headers
        # ============================================

        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Prevent clickjacking (enable for production)
        # add_header X-Frame-Options "SAMEORIGIN" always;

        # Enable XSS protection (older browsers)
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer Policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ============================================
        # Logging
        # ============================================

        access_log /var/log/nginx/access_https.log main;
        error_log /var/log/nginx/error_https.log warn;

        # ============================================
        # Health Check Endpoint
        # ============================================

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ============================================
        # Static Files (Optional - for frontend)
        # ============================================

        # location / {
        #     root /usr/share/nginx/frontend;
        #     try_files $uri /index.html;
        # }

        # ============================================
        # Django Static & Media Files (Added for Admin UI)
        # ============================================

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location /media/ {
            alias /app/media/;
            expires 30d;
        }

        # ============================================
        # Admin Panel Route
        # ============================================

        location /admin/ {
            proxy_pass http://backend;

            # Proxy headers - preserve client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Django-specific headers
            proxy_set_header X-Script-Name /admin;

            # Timeouts for admin operations
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ============================================
        # REST API Routes
        # ============================================

        location /api/ {
            proxy_pass http://backend;

            # Required proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Preserve original request information
            proxy_set_header Connection "";
            proxy_http_version 1.1;

            # Buffering for REST API (temporary buffering OK for regular requests)
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 64 4k;
            proxy_busy_buffers_size 8k;

            # Timeouts for REST API (30 seconds for normal requests)
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;

            # CORS headers (if not handled by backend)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # ============================================
        # WebSocket Route (Real-time Communication)
        # ============================================

        location /ws/ {
            # Forward to backend
            proxy_pass http://backend;

            # *** CRITICAL: WebSocket Upgrade Headers ***
            # Enable WebSocket protocol upgrade from HTTP to WS
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Preserve client information for real-time connections
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # *** CRITICAL: Disable Buffering for Real-time ***
            # WebSocket requires unbuffered connection
            proxy_buffering off;
            proxy_request_buffering off;

            # *** CRITICAL: Timeouts for Long-running Connections ***
            # WebSocket and long-polling can keep connections open for minutes
            # Set to 5 minutes (300s) to accommodate long-polling fallback
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Keep-alive settings for persistent connections
            proxy_set_header Connection "Upgrade";
            proxy_cache off;

            # No retries for WebSocket (not idempotent)
            proxy_next_upstream off;
        }

        # ============================================
        # Long-polling Fallback Route
        # ============================================

        location /api/message_queue/ {
            proxy_pass http://backend;

            # Required proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Use HTTP/1.1 for keep-alive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # *** IMPORTANT: Disable Buffering for Long-polling ***
            # Client needs to receive messages as soon as they arrive
            proxy_buffering off;
            proxy_request_buffering off;

            # *** IMPORTANT: Long Timeouts (up to 60 seconds for polling) ***
            # GET /api/message_queue/receive may wait 30+ seconds
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Retry configuration
            proxy_next_upstream_tries 0;  # No automatic retries
        }

        # ============================================
        # Catch-all Route (404)
        # ============================================

        location / {
            # Default response for undefined routes
            return 404;
        }
    }
}
