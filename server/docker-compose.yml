version: "3.8"

services:
  # ============================================
  # Nginx Reverse Proxy (Public-facing)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: helpdesk_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Configuration
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL/TLS certificates (for Nginx)
      - ./nginx/certs:/etc/nginx/certs:ro
      # Logs
      - nginx_logs:/var/log/nginx
    environment:
      # Certificate paths used in nginx.conf
      - NGINX_CERT_PATH=${NGINX_CERT_PATH:-/etc/nginx/certs/fullchain.pem}
      - NGINX_KEY_PATH=${NGINX_KEY_PATH:-/etc/nginx/certs/privkey.pem}
    depends_on:
      - backend
    networks:
      - helpdesk
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:15
    container_name: helpdesk_postgres_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME:-helpdesk_db}
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password123}
    ports:
      - "5432:5432"
    networks:
      - helpdesk

  # ============================================
  # Redis Cache/Channels Layer
  # ============================================
  redis:
    image: redis:alpine
    container_name: helpdesk_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - helpdesk

  # ============================================
  # Django Backend (Internal Only)
  # ============================================
  backend:
    build: .
    container_name: helpdesk_django_app
    restart: always
    command: daphne -b 0.0.0.0 -p ${WEBSOCKET_PORT:-8000} core.asgi:application
    volumes:
      - .:/app
    # ⚠️ IMPORTANT: No external port mapping
    # Backend is only accessible through Nginx reverse proxy (port 80/443)
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      # Django settings
      - DEBUG=${DEBUG:-True}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Database configuration
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.postgresql}
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-helpdesk_db}
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-password123}
      - DB_PORT=${DB_PORT:-5432}
      # Redis settings for Channel Layers
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      # WebSocket configuration
      - CHANNEL_CAPACITY=${CHANNEL_CAPACITY:-5000}
      - CHANNEL_EXPIRY=${CHANNEL_EXPIRY:-300}
      # ML Service
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://host.docker.internal:8001/ticket}
      - ML_SERVICE_TIMEOUT=${ML_SERVICE_TIMEOUT:-45}
      # Proxy support (for forwarded headers from Nginx)
      - SECURE_PROXY_HEADER_ENVIRON=${SECURE_PROXY_HEADER_ENVIRON:-HTTP_X_FORWARDED_FOR}
      - SECURE_PROXY_HEADER=${SECURE_PROXY_HEADER:-HTTP_X_FORWARDED_PROTO}
    depends_on:
      - db
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - helpdesk

# ============================================
# Volumes (Persistent Data)
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

# ============================================
# Networks (Service Communication)
# ============================================
networks:
  helpdesk:
    driver: bridge
    name: helpdesk
